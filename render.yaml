services:
  - type: web
    name: slaggy
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slaggy-db
          property: connectionString

databases:
  - name: slaggy-db
    plan: free
    databaseName: postgres
    user: postgres
