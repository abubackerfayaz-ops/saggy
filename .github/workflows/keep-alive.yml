name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site (retry on cold start)
        shell: bash
        run: |
          URL="https://saggy.onrender.com/health"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "attempt $i -> $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
